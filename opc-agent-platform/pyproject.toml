[project]
name = "opc-agent-platform"
version = "0.1.0"
description = "A minimal OPC matching platform using the official A2A protocol."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "a2a-sdk[http-server]==1.1.0",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.115.2,<1",
  "httpx>=0.28.1,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn>=0.35.0,<1",
  "websockets>=15.0,<16",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
opc-agent-platform = "opc_agent_platform.app:run"
opc-relay-node = "opc_agent_platform.relay_node:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opc_agent_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
